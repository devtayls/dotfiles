# Global workmux defaults (inspired by dkarter)
# For project-specific settings, create .workmux.yaml in project root
nerdfont: true
merge_strategy: rebase
agent: 'claude -n "$(basename "$PWD")"'

# Status icons for tmux window names
status_icons:
  working: ""
  waiting: "󱜸"
  done: ""

# Post-create hooks.
# apfs-clone (clonefile(2) on the directory root) is ~10x faster than `cp -cR`,
# which walks the tree and clonefiles each entry. See workmux/.local/bin/apfs-clone.
# For Node repos where node_modules is huge, prefer a per-project .workmux.yaml
# that symlinks it instead — Node resolves modules read-only, safe to share.
post_create:
  - '[ ! -f mise.toml ] || (mise trust --yes --silent && mise install)'
  - 'apfs-clone "$WM_PROJECT_ROOT/_build"              _build'
  - 'apfs-clone "$WM_PROJECT_ROOT/deps"                deps'
  - 'apfs-clone "$WM_PROJECT_ROOT/node_modules"        node_modules'
  - 'apfs-clone "$WM_PROJECT_ROOT/assets/node_modules" assets/node_modules'
  # Gitignored env files: plain cp (not clonefile) so edits don't propagate via COW.
  - '[ ! -f "$WM_PROJECT_ROOT/.env.local" ] || cp "$WM_PROJECT_ROOT/.env.local" .env.local'

# Pre-merge hooks (run tests before allowing merge).
# Idiom: `[ ! -f X ] || cmd` — if X is missing, skip cleanly; if X exists,
# cmd's exit code governs. Avoid `[ -f X ] && cmd || true`, which masks cmd failures.
pre_merge:
  - '[ ! -f mix.exs ] || mix test'

# Dashboard settings
dashboard:
  commit: "Commit staged changes with a descriptive message using conventional commits"
theme: emberforge
