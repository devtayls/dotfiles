# Global workmux defaults (inspired by dkarter)
# For project-specific settings, create .workmux.yaml in project root
nerdfont: true
merge_strategy: rebase
agent: 'claude -n "$(basename "$PWD")"'

# Status icons for tmux window names
status_icons:
  working: ""
  waiting: "󱜸"
  done: ""

# Post-create hooks
post_create:
  - '[ -f mise.toml ] && mise trust --yes --silent && mise install || true'
  # APFS clonefile (cp -c): copy-on-write, instant, ~0 disk until divergence.
  - 'cp -cR "$WM_PROJECT_ROOT/_build"              _build              2>/dev/null || true'
  - 'cp -cR "$WM_PROJECT_ROOT/deps"                deps                2>/dev/null || true'
  - 'cp -cR "$WM_PROJECT_ROOT/node_modules"        node_modules        2>/dev/null || true'
  - 'cp -cR "$WM_PROJECT_ROOT/assets/node_modules" assets/node_modules 2>/dev/null || true'
  # Gitignored env files: plain cp (not clonefile) so edits don't propagate via COW.
  - 'cp "$WM_PROJECT_ROOT/.env.local" .env.local 2>/dev/null || true'

# Pre-merge hooks (run tests before allowing merge).
# Idiom: `[ ! -f X ] || cmd` — if X is missing, skip cleanly; if X exists,
# cmd's exit code governs. Avoid `[ -f X ] && cmd || true`, which masks cmd failures.
pre_merge:
  - '[ ! -f mix.exs ] || mix test'

# Dashboard settings
dashboard:
  commit: "Commit staged changes with a descriptive message using conventional commits"
theme: emberforge
